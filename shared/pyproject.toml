[project]
name = "cadenza-contracts"
version = "1.0.0"
description = "CADenza shared schemas and contracts. Owned by the architect; imported by server/ and geometry/."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7",
    "jsonpatch>=1.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadenza_contracts"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
